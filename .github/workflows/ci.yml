name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CTEST_OUTPUT_ON_FAILURE: "1"
  VCPKG_DISABLE_METRICS: "1"
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.cache/vcpkg-binaries

jobs:
  build-test-install:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-msvc-release-tbb
            os: windows-latest
            compiler: msvc
            build_type: Release
            tbb: "ON"
            cc: ""
            cxx: ""
          - name: linux-gcc-debug-no-tbb
            os: ubuntu-latest
            compiler: gcc
            build_type: Debug
            tbb: "OFF"
            cc: gcc
            cxx: g++
          - name: linux-gcc-release-tbb
            os: ubuntu-latest
            compiler: gcc
            build_type: Release
            tbb: "ON"
            cc: gcc
            cxx: g++
          - name: linux-clang-release-tbb
            os: ubuntu-latest
            compiler: clang
            build_type: Release
            tbb: "ON"
            cc: clang
            cxx: clang++
          - name: macos-appleclang-release-tbb
            os: macos-latest
            compiler: appleclang
            build_type: Release
            tbb: "ON"
            cc: clang
            cxx: clang++

    steps:
      - name: Check out SmartParallel
        uses: actions/checkout@v4

      - name: Cache vcpkg binary packages
        if: matrix.tbb == 'ON'
        uses: actions/cache@v4
        with:
          path: .cache/vcpkg-binaries
          key: vcpkg-binaries-${{ runner.os }}-${{ matrix.compiler }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-binaries-${{ runner.os }}-${{ matrix.compiler }}-

      - name: Cache fallback vcpkg checkout
        if: matrix.tbb == 'ON'
        uses: actions/cache@v4
        with:
          path: .cache/vcpkg-source
          key: vcpkg-source-${{ runner.os }}-2026-07

      - name: Resolve vcpkg on Windows
        if: matrix.tbb == 'ON' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $root = $env:VCPKG_INSTALLATION_ROOT
          if (-not $root) {
            $command = Get-Command vcpkg -ErrorAction SilentlyContinue
            if ($command) {
              $candidate = Split-Path -Parent $command.Source
              if (Test-Path "$candidate/scripts/buildsystems/vcpkg.cmake") {
                $root = $candidate
              }
            }
          }
          if (-not $root -or -not (Test-Path "$root/scripts/buildsystems/vcpkg.cmake")) {
            $root = Join-Path $env:GITHUB_WORKSPACE ".cache/vcpkg-source"
            if (-not (Test-Path "$root/.git")) {
              git clone --depth 1 https://github.com/microsoft/vcpkg.git $root
            }
            & "$root/bootstrap-vcpkg.bat" -disableMetrics
          }
          $root = (Resolve-Path $root).Path.Replace('\', '/')
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          "VCPKG_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Resolve vcpkg on Unix
        if: matrix.tbb == 'ON' && runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          root=""
          candidates=(
            "${VCPKG_INSTALLATION_ROOT:-}"
            "/usr/local/share/vcpkg"
            "/opt/homebrew/share/vcpkg"
          )
          if command -v vcpkg >/dev/null 2>&1; then
            executable="$(python3 -c 'import os,sys; print(os.path.realpath(sys.argv[1]))' "$(command -v vcpkg)")"
            candidates+=("$(dirname "$executable")")
          fi
          for candidate in "${candidates[@]}"; do
            if [[ -n "$candidate" && -f "$candidate/scripts/buildsystems/vcpkg.cmake" ]]; then
              root="$candidate"
              break
            fi
          done
          if [[ -z "$root" ]]; then
            root="$GITHUB_WORKSPACE/.cache/vcpkg-source"
            if [[ ! -d "$root/.git" ]]; then
              rm -rf "$root"
              git clone --depth 1 https://github.com/microsoft/vcpkg.git "$root"
            fi
            if [[ ! -x "$root/vcpkg" ]]; then
              "$root/bootstrap-vcpkg.sh" -disableMetrics
            fi
          fi
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          echo "VCPKG_ROOT=$root" >> "$GITHUB_ENV"

      - name: Configure on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ('${{ matrix.tbb }}' -eq 'OFF') {
            Remove-Item Env:VCPKG_ROOT -ErrorAction SilentlyContinue
          }
          $arguments = @(
            '-S', '.',
            '-B', 'build/ci',
            '-A', 'x64',
            '-DSMARTPARALLEL_BUILD_VALIDATION=ON',
            '-DSMARTPARALLEL_BUILD_BENCHMARKS=OFF',
            '-DSMARTPARALLEL_BUILD_REAL_WORLD_BENCHMARKS=OFF',
            '-DSMARTPARALLEL_INSTALL=ON',
            '-DSMARTPARALLEL_ENABLE_TBB=${{ matrix.tbb }}',
            '-DSMARTPARALLEL_REQUIRE_TBB=${{ matrix.tbb }}',
            '-DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/build/install'
          )
          if ('${{ matrix.tbb }}' -eq 'ON') {
            $arguments += '-DVCPKG_INSTALLED_DIR=${{ github.workspace }}/build/vcpkg_installed'
          }
          cmake @arguments

      - name: Configure on Unix
        if: runner.os != 'Windows'
        shell: bash
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          set -euo pipefail
          if [[ '${{ matrix.tbb }}' == 'OFF' ]]; then
            unset VCPKG_ROOT VCPKG_INSTALLATION_ROOT
          fi
          arguments=(
            -S .
            -B build/ci
            -G Ninja
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
            -DSMARTPARALLEL_BUILD_VALIDATION=ON
            -DSMARTPARALLEL_BUILD_BENCHMARKS=OFF
            -DSMARTPARALLEL_BUILD_REAL_WORLD_BENCHMARKS=OFF
            -DSMARTPARALLEL_INSTALL=ON
            -DSMARTPARALLEL_ENABLE_TBB=${{ matrix.tbb }}
            -DSMARTPARALLEL_REQUIRE_TBB=${{ matrix.tbb }}
            -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/build/install
          )
          if [[ '${{ matrix.tbb }}' == 'ON' ]]; then
            arguments+=("-DVCPKG_INSTALLED_DIR=${GITHUB_WORKSPACE}/build/vcpkg_installed")
          fi
          cmake "${arguments[@]}"

      - name: Build SmartParallel
        shell: bash
        run: cmake --build build/ci --config ${{ matrix.build_type }} --parallel 2

      - name: Run deterministic correctness tests
        shell: bash
        run: ctest --test-dir build/ci -C ${{ matrix.build_type }} --output-on-failure --parallel 2

      - name: Install SmartParallel
        shell: bash
        run: cmake --install build/ci --config ${{ matrix.build_type }}

      - name: Configure installed-package consumer on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $arguments = @(
            '-S', 'tests/package-consumer',
            '-B', 'build/package-consumer',
            '-A', 'x64',
            '-DCMAKE_PREFIX_PATH=${{ github.workspace }}/build/install'
          )
          if ('${{ matrix.tbb }}' -eq 'ON') {
            $arguments += "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
            $arguments += '-DVCPKG_INSTALLED_DIR=${{ github.workspace }}/build/vcpkg_installed'
          }
          cmake @arguments

      - name: Configure installed-package consumer on Unix
        if: runner.os != 'Windows'
        shell: bash
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          set -euo pipefail
          arguments=(
            -S tests/package-consumer
            -B build/package-consumer
            -G Ninja
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
            -DCMAKE_PREFIX_PATH=${GITHUB_WORKSPACE}/build/install
          )
          if [[ '${{ matrix.tbb }}' == 'ON' ]]; then
            arguments+=(
              "-DCMAKE_TOOLCHAIN_FILE=${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake"
              "-DVCPKG_INSTALLED_DIR=${GITHUB_WORKSPACE}/build/vcpkg_installed"
            )
          fi
          cmake "${arguments[@]}"

      - name: Build installed-package consumer
        shell: bash
        run: cmake --build build/package-consumer --config ${{ matrix.build_type }} --parallel 2

      - name: Test installed-package consumer
        shell: bash
        run: ctest --test-dir build/package-consumer -C ${{ matrix.build_type }} --output-on-failure

  sanitizers:
    name: linux-clang-debug-asan-ubsan
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CC: clang
      CXX: clang++
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - name: Check out SmartParallel
        uses: actions/checkout@v4

      - name: Configure sanitizer build
        shell: bash
        run: |
          cmake -S . -B build/sanitizers -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DSMARTPARALLEL_BUILD_VISION=ON \
            -DSMARTPARALLEL_ENABLE_OPENCV_PROVIDER=OFF \
            -DSMARTPARALLEL_BUILD_VALIDATION=ON \
            -DSMARTPARALLEL_BUILD_BENCHMARKS=OFF \
            -DSMARTPARALLEL_BUILD_REAL_WORLD_BENCHMARKS=OFF \
            -DSMARTPARALLEL_ENABLE_TBB=OFF \
            -DSMARTPARALLEL_ENABLE_SANITIZERS=ON \
            -DSMARTPARALLEL_INSTALL=OFF

      - name: Build sanitizer targets
        run: cmake --build build/sanitizers --parallel 2

      - name: Run sanitizer correctness tests
        run: ctest --test-dir build/sanitizers --output-on-failure --parallel 1

  native-vision:
    name: linux-clang-release-native-vision
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CC: clang
      CXX: clang++
    steps:
      - name: Check out SmartParallel
        uses: actions/checkout@v4

      - name: Configure native vision validation
        run: |
          cmake -S . -B build/native-vision -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DSMARTPARALLEL_BUILD_VISION=ON \
            -DSMARTPARALLEL_ENABLE_OPENCV_PROVIDER=OFF \
            -DSMARTPARALLEL_BUILD_VALIDATION=ON \
            -DSMARTPARALLEL_BUILD_BENCHMARKS=OFF \
            -DSMARTPARALLEL_ENABLE_TBB=OFF \
            -DSMARTPARALLEL_INSTALL=ON \
            -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/build/native-vision-install

      - name: Build and test native vision
        run: |
          cmake --build build/native-vision --parallel 2
          ctest --test-dir build/native-vision --output-on-failure --parallel 2
          cmake --install build/native-vision

      - name: Configure installed vision consumer
        run: |
          cmake -S tests/package-consumer-vision -B build/native-vision-consumer -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=${{ github.workspace }}/build/native-vision-install

      - name: Build installed vision consumer
        run: cmake --build build/native-vision-consumer --parallel 2

      - name: Run installed vision consumer
        run: ctest --test-dir build/native-vision-consumer --output-on-failure

  documentation:
    name: documentation-and-release-evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out SmartParallel
        uses: actions/checkout@v4

      - name: Validate documentation, release metadata, and accepted evidence
        run: python3 tools/check_documentation.py

      - name: Validate Python publication tools
        run: |
          python3 -m py_compile \
            tools/analyze_v15_adaptive_routes.py \
            tools/analyze_v16_scientific_foundations.py \
            tools/analyze_v17_reproducible_runtime.py \
            tools/generate_v15_benchmark_plots.py \
            tools/publish_v15_benchmark_docs.py \
            tools/publish_v16_benchmark_docs.py \
            tools/create_source_release_zip.py \
            tools/generate_source_manifest.py \
            tools/verify_source_manifest.py \
            tools/validate_benchmark_smoke.py \
            tools/check_documentation.py
